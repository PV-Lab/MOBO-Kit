    unit: M
    start: 1.00
    stop: 2.00
    step: 0.05
  - name: precur_vol
    unit: uL
    start: 40
    stop: 200
    step: 10
  - name: anneal_temp
    unit: C
    start: 100
    stop: 185
    step: 5
  - name: anneal_time
    unit: min
    start: 10
    stop: 60
    step: 5
  - name: anti_vol
    unit: uL
    start: 100
    stop: 200
    step: 5
  - name: anti_time
    unit: s
    start: 9
    stop: 25
