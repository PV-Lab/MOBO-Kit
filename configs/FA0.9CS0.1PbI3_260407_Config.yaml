# Canonical D2D input grid for Step 1 infrastructure tests.
#
# Objective formulas, control policy, process constraints, and campaign reference
# point are intentionally unresolved. This file must not be used to generate R1/R2
# candidates until those scientific decisions are approved and recorded.
