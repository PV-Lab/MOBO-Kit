    unit: rpm
    start: 1000
    stop: 6000
    step: 500
  - name: time_1
    unit: s
    start: 5
    stop: 50
    step: 5
  - name: speed_2
    unit: rpm
    start: 0
    stop: 5000
    step: 500
  - name: time_2
    unit: s
    start: 10
    stop: 60
    step: 5
