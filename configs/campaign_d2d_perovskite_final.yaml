# D2D FINAL campaign - FA0.9Cs0.1PbI3 slot-die/spin. THE REAL RUN.
#
# Rounds: R0 (15 measured, complete) -> R1 UCB-HVI (5 conditions) -> R2 qLogNEHVI (3).
# Each proposed condition is run in triplicate.
#
# THREE CONTRACTS HAVE EXISTED. Naming them is not bookkeeping -- utility space is
# what hypervolume is measured in, and an objective that keeps its name while
# changing its construction makes every cross-contract number incomparable while
# every plot still renders.
#
#   v2  d2d-objectives-v2-nm-thickness  ALGORITHM TESTING. Proved the loop worked.
#   v3  d2d-objectives-v3-test          DRY RUN on test data. Rehearsed this
#                                       contract's shape; the workbook was
#                                       literally called "Test".
#   v4  d2d-objectives-v4-final         THIS ONE. The campaign that produces films.
#
# Nothing from v2 or v3 transfers. Their fitted numbers are about quantities that
# have been redefined twice.
#
# The workbook is local_inputs/Final Summary Table.xlsx (gitignored). Its columns
# moved again: the three scores are now AJ / AK / AL, and the thickness readings
# are AC..AF with AG holding the operator's anomalies.
campaign:
  name: D2D_FA0.9Cs0.1PbI3_final
  status: active
  schema_version: d2d-campaign-v4
  workbook_profile: d2d_summary_final_v4
  # NEW KEY. The workbook names its sheets by round now, so the sheet holding the
  # measured rows is campaign configuration rather than the hard-coded "Sheet1"
  # every earlier contract assumed.
  #
  # The workbook also carries an `R1` sheet. IT IS DELIBERATELY NOT READ. The
  # round contract is unchanged: each round's worklist is written to a NEW file
  # beside the workbook and filled in there, and the source workbook is never
  # opened for writing. That sheet is the group's own template and the tool
  # ignores it.
  source_sheet: R0

# Ten inputs, columns B..K of the R0 sheet, in this order. GRIDS UNCHANGED from
# v3 -- verified, all 15 measured rows land on them.
inputs:
  - name: speed_1
    unit: rpm
    start: 1000
    stop: 6000
    step: 500
  - name: time_1
    unit: s
    start: 5
    stop: 50
    step: 5
  - name: speed_2
    unit: rpm
    start: 0
    stop: 5000
    step: 500
  - name: time_2
    unit: s
    start: 0
    stop: 60
    step: 5
  - name: precur_conc
    unit: M
    start: 1.00
    stop: 2.00
    step: 0.05
  - name: precur_vol
    unit: uL
    start: 40
    stop: 200
    step: 10
  - name: anneal_temp
    unit: C
    start: 100
    stop: 185
    step: 5
  - name: anneal_time
    unit: min
    start: 10
    stop: 60
    step: 5
  - name: anti_vol
    unit: uL
    start: 100
    stop: 200
    step: 5
  - name: anti_time
    unit: s
    start: 9
    stop: 25
    step: 1

# THE SCORES ARE FROZEN. Read the group's decision before changing anything here.
#
# Uniformity and optoelectronic are taken from the workbook AS STORED, with no
# recomputation in Python. That is a deliberate reversal of this project's usual
# polarity, which is "Python computes and the stored cell is a cross-check".
#
# WHY. Both objectives have now been renormalised twice -- uniformity's clamp and
# optoelectronic's Voc/photoconductance weighting -- and the group is still
# revising them. Reimplementing a formula that is about to change means the code
# and the sheet disagree at exactly the moment someone edits the sheet, and the
# disagreement looks like a bug in whichever was checked second. Reading the value
# makes the workbook the single source of truth while the definition moves.
#
# WHAT THIS COSTS, stated plainly because it is the cross-check this project
# otherwise insists on: there is NO independent recomputation of these two
# objectives under this contract, so a stale pasted literal in AJ or AK cannot be
# caught by comparing it against anything. `formula_fingerprint` is the partial
# replacement -- it notices when the DEFINITION moves, not when a value goes
# stale. The v3 recipes remain in `scores.py`, unwired, for when the group settles
# the formulas and these objectives are unfrozen.
#
# Thickness is NOT frozen. Its definition has been stable across all three
# contracts, the model trains on raw nanometres rather than on the score, and the
# recomputation is what lets `T anom` be excluded and reported.
objectives:
  contract_version: d2d-objectives-v4-final
  scaling_mode: fixed_affine
  specs:
  - name: uniformity
    model_source_column: "Uniformity score (Avg (Coverage + (1-Uniformity) + Phase purity))"
    transform: affine
    goal: maximize
    # FROZEN. AJ = (L + O + P) / 3 in the sheet. Read, never recomputed.
    measurement:
      recipe: stored
      inputs:
        - {column: "Uniformity score (Avg (Coverage + (1-Uniformity) + Phase purity))"}
      # Not a cross-check -- there is nothing to check against under a freeze.
      # This records the definition so a change to it is audible.
      formula_fingerprint:
        column: "Uniformity score (Avg (Coverage + (1-Uniformity) + Phase purity))"
        formula: "=(L2+O2+P2)/3"
    # A mean of three terms each in [0, 1] is in [0, 1] by construction, so these
    # anchors are the objective's range rather than a guess. Observed span on the
    # 15 rows: 0.599 to 0.882.
    lower_anchor: 0.0
    upper_anchor: 1.0
    # MEASURED ON THESE ROWS, 2026-09-02. Plain GP LOO R2 -0.4778 against a null
    # of -0.1480: no learnable signal, for the third contract running. R1 is
    # exploration-dominated for this objective by design.
    signal_status: exploration_only

  - name: optoelectronic
    model_source_column: "Optoelectronic score (Normalized (Voc + (0.75*Photoconductance + 0.25*Photosensitivity))/2"
    transform: affine
    goal: maximize
    # FROZEN. AK = (S + (0.75*Y + 0.25*AB)) / 2 in the sheet: normalised Voc
    # against a 1.3 V cap, plus a weighted blend of normalised photoconductance
    # and normalised capped photosensitivity. Read, never recomputed.
    #
    # THE v3 PHOTOCONDUCTANCE INVERSION IS FIXED. On the v3 workbook the
    # normalised column ranked BACKWARDS against its own raw measurement
    # (Spearman -0.5484, p = 0.0343). On this one the same comparison gives
    # +1.0000. The diagnostic below stays anyway: it is cheap, and the failure it
    # watches for is silent when it recurs.
    measurement:
      recipe: stored
      inputs:
        - {column: "Optoelectronic score (Normalized (Voc + (0.75*Photoconductance + 0.25*Photosensitivity))/2"}
      formula_fingerprint:
        column: "Optoelectronic score (Normalized (Voc + (0.75*Photoconductance + 0.25*Photosensitivity))/2"
        formula: "=(S2+((0.75*Y2)+(0.25*AB2)))/2"
      agreement_check:
        raw: "Photoconductance (Max - based on raw slopes)"
        normalized: "Normalized photoconductance (test)"
        min_spearman: 0.0
    # Both terms are normalised to [0, 1], so their mean is too. Observed span on
    # the 15 rows: 0.477 to 0.762.
    lower_anchor: 0.0
    upper_anchor: 1.0
    # MEASURED ON THESE ROWS, 2026-09-02. Plain GP LOO R2 -0.7038 against a null
    # of -0.1480 -- further below it than on v3 (-0.5842), even though the
    # photoconductance inversion that made v3's version suspect is fixed. The
    # renormalisation did not make this axis learnable, and no mean function is
    # declared: the first campaign's anneal_temp trend was deleted on v3's intake
    # verdict and nothing since has argued for reinstating it.
    signal_status: exploration_only

  - name: thickness
    # trains on nanometres, NOT on the workbook thickness score
    model_source_column: "Thickness (avg)"
    transform: gaussian_target
    goal: target
    target: 650.0
    # the workbook writes EXP(-(((AH-650)/250)^2)), which has no factor of 1/2;
    # in the exp(-0.5*((T-c)/sigma)^2) convention used here that is 250/sqrt(2)
    sigma: 176.7766952966369
    equivalent_workbook_formula: "EXP(-(((AH-650)/250)^2))"
    # MEASURED ON THESE ROWS, 2026-09-02. The only objective with signal, for the
    # third contract running: plain GP +0.5814 against a null of -0.1480.
    signal_status: learnable
    # NOT frozen, and the only objective still computed in Python. Its definition
    # has been stable across all three contracts and the recomputation earns its
    # place: it is what lets `T anom` be excluded from the mean and reported
    # rather than silently dropped.
    #
    # The readings moved to AC..AF and the anomaly column to AG. Rows carry three
    # or four readings, so `mean_of_present` is what the data needs.
    #
    # `Thickness (avg)` is a live unrounded AVERAGE, so anything above
    # floating-point noise is a real disagreement -- hence the tight tolerance.
    measurement:
      recipe: mean_of_present
      inputs:
        - {column: "T1"}
        - {column: "T2"}
        - {column: "T3"}
        - {column: "T4"}
      excluded:
        - {column: "T anom"}
      cross_check:
        - {column: "Thickness (avg)", atol: 1.0e-9}
      spread_warning_ratio: 0.25
    replicate_aggregate: mean_of_log
    # KEPT, on the rank permutation rather than on R2 -- the same standing it has
    # had on every contract. Spin-coating physics fixes the two predictors before
    # any fitting, so this is not selection on the outcome.
    #
    # Intake 2026-09-02 left it INCONCLUSIVE ON R2: plain +0.5814, structured
    # +0.7422, a swing of +0.1608 against a resolution floor of 0.236. That is not
    # a verdict, it is a statement that R2 cannot resolve it at N=15.
    #
    # The permutation adjudicated, and it holds on this contract too:
    #
    #   observed rank rho  +0.6500
    #   null mean          -0.1892  (sd 0.2944)
    #   exceedances        9 of 1800
    #   p                  0.0056   95% CI [0.0021, 0.0090]
    #
    # Reproduce with:
    #   python scripts/permutation_rank_test.py --objective thickness --permutations 1800
    #
    # v3's p was 0.0028 on its own rows; that verdict did not transfer and this one
    # was measured fresh. Rank is the right statistic because rank is what the
    # acquisition consumes. Do not quote the +0.1608 swing as evidence.
    mean_function:
      response: log
      features:
        - column: speed_1
          transform: log
        - column: precur_conc
          transform: log

# Reference point in UTILITY space, carried over verbatim. All three objectives
# live natively in [0, 1], so no axis dominates.
reference_point_utility: [-0.01, -0.01, -0.01]

rounds:
  r1:
    method: ucb_hvi
    batch_size: 5
    replicates_per_condition: 3
    # KEPT at 36, and the rationale is re-earned rather than inherited. It was
    # chosen for the v3 dry run because two of three objectives carried no
    # learnable signal, which makes heavy exploration the right posture. Both have
    # been renormalised since -- including the photoconductance fix that was the
    # recorded trigger to revisit this -- and on v4 still only thickness beats the
    # null. Had two or more axes become learnable, this would have come back toward
    # the sweep-settled beta = 4.
    #
    # Determined originally by a sweep of box plots and heat maps (2-D slices
    # through the higher-dimensional GP) over beta 9..49 and radius 0.05..0.45.
    # That sweep could not RANK cells -- spread 0.0065 against a trial sd of
    # 0.010-0.027 -- so this is a declared policy about how much to explore, not a
    # measured optimum. Note that local penalization is inert at this beta.
    beta: 36.0
    candidate_pool_size: 32768
    posterior_samples: 256
    moment_method: monte_carlo
  r2:
    method: qlognehvi
    batch_size: 3
    replicates_per_condition: 3
    candidate_pool_size: 32768
    mc_samples: 128
    sequential_pending: true

# Carried over verbatim from v3. All 15 measured rows satisfy all three -- sample
# 2 was `speed_2 = 0, time_2 = 60` in an earlier draft of this workbook, which
# breaks the first rule; the group corrected it to `time_2 = 0`.
constraints:
  - zero_coupled: [speed_2, time_2]
    name: second_stage_all_or_nothing
  - sum_upper_strict: {lhs: anti_time, rhs: [time_1, time_2]}
    name: antisolvent_lands_while_spinning
  - nonzero_minimum: {column: time_2, minimum: 10}
    name: second_stage_runs_at_least_10s

review:
  probes: []

  notes:
    - >
      UNIFORMITY AND OPTOELECTRONIC ARE TAKEN FROM THE WORKBOOK AS STORED. There
      is no independent recomputation of either under this contract, by decision,
      because the group is still revising how they are defined. The consequence
      worth knowing while reading a batch: a stale pasted value in those columns
      would not be caught by anything here. The formula fingerprints catch a
      changed definition; they cannot catch a value that has stopped tracking its
      inputs.
    - >
      The photoconductance inversion that made the previous contract's
      optoelectronic axis provisional is FIXED. Normalised photoconductance now
      ranks with its raw measurement at Spearman +1.0000, against -0.5484 before.
      The diagnostic stays on because the failure is silent when it recurs.

local_penalization:
  distance_metric: normalized_euclidean
  dimension_weights: null
  # PROVISIONAL, with beta above. Radius binds less as beta rises; at beta = 36 on
  # v3 the achieved batch spacing was 1.091 against this 0.35, so the knob had
  # nothing to act on.
  radius: 0.35
  min_batch_distance: 0.15
  min_observed_distance: 0.0

model:
  variant: dim_scaled_prior
  # Once the R1 triplicates land, switch to `replicate_pooled` -- one key.
  observation_noise: fit_from_marginal_likelihood

  replicate_variance:
    # RECOMPUTE ON THIS WORKBOOK before trusting it. The value below is v3's
    # within-film floor; the v4 thickness readings differ (sample 1's 418.5 moved
    # to `T anom`, so its mean moved 579.9 -> 633.7). Intake reports the new one.
    sanity_floor:
      thickness: 0.006374
    rows_without_replicates: 1

reproducibility:
  seed: 73
  record_git_commit: true
  record_environment_versions: true
  record_resolved_config_hash: true
