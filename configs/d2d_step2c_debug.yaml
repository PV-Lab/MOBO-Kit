# Public-safe Step 2C robustness template for deterministic synthetic debugging.
schema_version: d2d-step2c-robustness-debug-1
campaign_id: d2d-step2c-public-debug
run_mode: debug
approved_for_experiment: false
approved_for_production: false
debug_watermark: "DEBUG ONLY - NOT APPROVED FOR EXPERIMENT"
base_step2b_config: configs/d2d_step2b_debug.yaml

workbook:
  source_kind: sanitized_synthetic_ci

objectives:
  order: [uniformity_score, optoelectronic_score, thickness_score]
  source_columns: [Uniformity score, Optoelectronic score, Thickness score]
  reference_point: [-0.01, -10.0, -0.01]
  transforms: [identity, identity, identity]
  directions: [maximize, maximize, maximize]
  bounds:
    uniformity_score: {lower: 0.0, upper: 1.0}
    optoelectronic_score: {lower: null, upper: null}
    thickness_score: {lower: 0.0, upper: 1.0}
  known_uniformity_mismatch:
    allowed_in_debug: true
    blocks_experimental_approval: true

r0:
  inherit_from_base: true

constraints: []

ucb_hvi:
  moment_method: analytic_identity
  beta_values: [1.0, 4.0, 9.0]
  primary_beta: 4.0
  positive_hvi_threshold: 0.0
  numeric_tolerance: 1.0e-12
  score_chunk_size: 2048
  bound_policies: [none, clip_ucb]
  primary_bound_policy: clip_ucb
  mc_comparison_samples: 2048
  mc_comparison_seed: 73

candidate_search:
  method: nested_sobol_grid_indices
  scramble: true
  primary_seed: 73
  secondary_seeds: [137, 911]
  nested_unique_sizes: [16384, 32768, 65536, 131072]
  primary_full_size: 131072
  preserve_accepted_prefix_nesting: true

local_refinement:
  enabled: true
  anchors_per_selection_step: 64
  max_sweeps: 10
  improvement_tolerance: 1.0e-10
  coordinate_values: all_allowed_grid_values
  stable_tie_break: lower_grid_index

local_penalty_study:
  hard_distance_relaxation: false
  variants:
    - {label: no_soft_no_hard, radius: null, min_batch_distance: 0.0}
    - {label: no_soft_hard_0_15, radius: null, min_batch_distance: 0.15}
    - {label: radius_0_15, radius: 0.15, min_batch_distance: 0.15}
    - {label: radius_0_25, radius: 0.25, min_batch_distance: 0.15}
    - {label: radius_0_35, radius: 0.35, min_batch_distance: 0.15}
  primary_variant: radius_0_25
  min_observed_distance: 0.0
  dimension_weights: null

models:
  variants:
    - {name: default_current, type: existing_default}
    - name: conservative
      type: explicit_conservative
      min_noise: 0.01
      min_lengthscale: 0.05
  primary_for_debug: default_current
  exact_leave_one_out: true
  report_training_posterior_only_as_diagnostic: true

observation_influence:
  enabled: true
  omitted_sample_ids: [1001, 1002, 1003, 1004, 1005, 1006, 1007, 1008, 1009, 1010, 1011, 1012, 1013, 1014, 1015]
  common_pool_size: 32768
  common_pool_seed: 73
  top_k: 100
  regional_thresholds: [0.10, 0.15, 0.20]

robust_regions:
  clustering: agglomerative_complete_link
  primary_distance_threshold: 0.15
  sensitivity_thresholds: [0.10, 0.20]
  shortlist_min: 8
  shortlist_max: 12
  consensus_batch_size: 5
  consensus_required_criteria:
    largest_two_nested_regional_matches_within_0_15: 4
    largest_two_nested_mean_matched_distance_max: 0.10
    minimum_region_family_coverage: 3
    require_grid_valid: true
    require_hard_distance_valid: true

execution_modes:
  fast:
    nested_unique_sizes: [512, 1024, 2048, 4096]
    anchors_per_selection_step: 8
    omitted_sample_ids: [1001, 1002, 1003]
    mc_comparison_samples: 256
  full:
    nested_unique_sizes: [16384, 32768, 65536, 131072]
    anchors_per_selection_step: 64
    omitted_sample_ids: [1001, 1002, 1003, 1004, 1005, 1006, 1007, 1008, 1009, 1010, 1011, 1012, 1013, 1014, 1015]
    mc_comparison_samples: 2048

reproducibility:
  model_seed: 73
  record_git_commit: true
  record_dirty_state: true
  record_environment_versions: true
  record_config_hash: true
  record_workbook_hash_and_mtime_before_after: true

outputs:
  root: local_outputs/d2d_step2c_robustness
  tracked_private_recipes: false
  create_portable_ignored_zip: true
